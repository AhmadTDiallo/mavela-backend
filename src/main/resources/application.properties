spring.application.name=mavela-backend

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/mavela
spring.datasource.username=mavela_app
spring.datasource.password=${MAVELA_DB_PASSWORD}
spring.config.import=optional:file:.env[.properties]

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Staff review is disabled unless all Cognito settings are supplied. Admin
# routes then fail closed and never accept a customer bearer token.
mavela.admin.auth.enabled=${MAVELA_ADMIN_AUTH_ENABLED:false}
mavela.admin.auth.issuer-uri=${MAVELA_ADMIN_AUTH_ISSUER_URI:}
mavela.admin.auth.client-id=${MAVELA_ADMIN_AUTH_CLIENT_ID:}
mavela.admin.auth.groups-claim=${MAVELA_ADMIN_AUTH_GROUPS_CLAIM:cognito:groups}

# Private KYC evidence storage is opt-in. Production deployments must provide
# an HTTPS S3-compatible endpoint, a private bucket, and credentials through
# the platform's default AWS credential provider chain.
mavela.kyc.storage.enabled=${MAVELA_KYC_STORAGE_ENABLED:false}
mavela.kyc.storage.bucket=${MAVELA_KYC_STORAGE_BUCKET:}
mavela.kyc.storage.region=${MAVELA_KYC_STORAGE_REGION:af-south-1}
mavela.kyc.storage.endpoint=${MAVELA_KYC_STORAGE_ENDPOINT:}
mavela.kyc.storage.presign-endpoint=${MAVELA_KYC_STORAGE_PRESIGN_ENDPOINT:}
mavela.kyc.storage.access-key-id=${MAVELA_KYC_STORAGE_ACCESS_KEY_ID:}
mavela.kyc.storage.secret-access-key=${MAVELA_KYC_STORAGE_SECRET_ACCESS_KEY:}
mavela.kyc.storage.force-path-style=${MAVELA_KYC_STORAGE_FORCE_PATH_STYLE:false}
mavela.kyc.storage.allow-insecure-endpoint=${MAVELA_KYC_STORAGE_ALLOW_INSECURE_ENDPOINT:false}
mavela.kyc.storage.upload-url-ttl=${MAVELA_KYC_STORAGE_UPLOAD_URL_TTL:PT10M}
mavela.kyc.storage.max-image-size-bytes=${MAVELA_KYC_STORAGE_MAX_IMAGE_SIZE_BYTES:10485760}
mavela.kyc.storage.server-side-encryption=${MAVELA_KYC_STORAGE_SERVER_SIDE_ENCRYPTION:AES256}

# QSwitch is disabled by default. Mock mode must be explicitly enabled for
# local development, while live mode fails closed until the confirmed UAT OAuth
# and read-operation contract is supplied through environment variables.
mavela.qswitch.enabled=${MAVELA_QSWITCH_ENABLED:false}
mavela.qswitch.mode=${MAVELA_QSWITCH_MODE:MOCK}
mavela.qswitch.base-url=${MAVELA_QSWITCH_BASE_URL:}
mavela.qswitch.token-path=${MAVELA_QSWITCH_TOKEN_PATH:/api/oauth/token}
mavela.qswitch.client-id=${MAVELA_QSWITCH_CLIENT_ID:}
mavela.qswitch.client-secret=${MAVELA_QSWITCH_CLIENT_SECRET:}
mavela.qswitch.token-request-encoding=${MAVELA_QSWITCH_TOKEN_REQUEST_ENCODING:UNCONFIRMED}
mavela.qswitch.token-grant-type-field=${MAVELA_QSWITCH_TOKEN_GRANT_TYPE_FIELD:}
mavela.qswitch.token-grant-type-value=${MAVELA_QSWITCH_TOKEN_GRANT_TYPE_VALUE:}
mavela.qswitch.token-client-id-field=${MAVELA_QSWITCH_TOKEN_CLIENT_ID_FIELD:}
mavela.qswitch.token-client-secret-field=${MAVELA_QSWITCH_TOKEN_CLIENT_SECRET_FIELD:}
mavela.qswitch.token-scope-field=${MAVELA_QSWITCH_TOKEN_SCOPE_FIELD:}
mavela.qswitch.token-access-token-field=${MAVELA_QSWITCH_TOKEN_ACCESS_TOKEN_FIELD:}
mavela.qswitch.token-expires-in-field=${MAVELA_QSWITCH_TOKEN_EXPIRES_IN_FIELD:}
mavela.qswitch.scopes=${MAVELA_QSWITCH_SCOPES:}
mavela.qswitch.connect-timeout=${MAVELA_QSWITCH_CONNECT_TIMEOUT:PT3S}
mavela.qswitch.read-timeout=${MAVELA_QSWITCH_READ_TIMEOUT:PT5S}
mavela.qswitch.token-refresh-safety-window=${MAVELA_QSWITCH_TOKEN_REFRESH_SAFETY_WINDOW:PT30S}
mavela.qswitch.max-read-retries=${MAVELA_QSWITCH_MAX_READ_RETRIES:1}
mavela.qswitch.retry-initial-backoff=${MAVELA_QSWITCH_RETRY_INITIAL_BACKOFF:PT0.2S}
mavela.qswitch.retry-max-backoff=${MAVELA_QSWITCH_RETRY_MAX_BACKOFF:PT2S}
mavela.qswitch.rate-limit-per-minute=${MAVELA_QSWITCH_RATE_LIMIT_PER_MINUTE:100}
mavela.qswitch.rate-limit-burst=${MAVELA_QSWITCH_RATE_LIMIT_BURST:20}
