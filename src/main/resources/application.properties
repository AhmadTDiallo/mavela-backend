spring.application.name=mavela-backend

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/mavela
spring.datasource.username=mavela_app
spring.datasource.password=${MAVELA_DB_PASSWORD}
spring.config.import=optional:file:.env[.properties]

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
